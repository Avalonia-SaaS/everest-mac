name: build
on:
  push:
    # main and release tags only: archive/* tags point at old commits whose
    # workflow still used a GitHub macOS runner.
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  build:
    # Self-hosted Mac Studio runner on a public fork: never run code from a fork's PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, everest, macstudio]
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (no keyboard needed)
        run: swift test
      - name: Build
        run: swift build -c release
      # Checks the bundle and its zip; nothing is uploaded to GitHub (no
      # artifact storage): releases come from scripts/release.sh.
      - name: Build the app bundle
        run: ./make-app.sh --zip
